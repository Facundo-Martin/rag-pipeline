site_name: RAG Pipeline Architecture
site_description: Documentation for the ETL pipelines and backend services
theme:
  name: material
  logo: assets/your-logo.png # Add a slick logo
  font:
    text: Inter # Modern, clean sans-serif font
    code: Fira Code # Beautiful code font
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black # Stealthy, modern dark mode
      accent: deep purple
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
nav:
  - Home: index.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Writing Modules: guides/writing-modules.md
      - Tooling & Scripts: guides/tooling-and-scripts.md
  - Core Concepts:
      - System Architecture: core_concepts/system-architecture.md
      - Tooling Philosophy: core_concepts/tooling-philosophy.md
  - Modules:
      - Ingestion:
          - Architecture: modules/ingestion/architecture.md
          - Tutorial: modules/ingestion/tutorial.md
          - Reference: modules/ingestion/reference.md
