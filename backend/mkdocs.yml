site_name: RAG Pipeline Architecture
site_description: Documentation for the ETL pipelines and backend services
theme:
  name: material
  logo: assets/your-logo.png
  font:
    text: Inter
    code: Fira Code
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
  features:
    - navigation.indexes # Allows folder-level index.md files
    - navigation.sections # Renders top-level folders as flat headers, removing toggles
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search
  - awesome-pages # Automatically generates the nav from the file system

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
