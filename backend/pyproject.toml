[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "gunicorn>=26.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn-worker>=0.4.0",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
