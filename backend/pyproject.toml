[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=23.1.0",
    "arxiv>=4.0.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "gunicorn>=26.2.0",
    "passlib>=1.7.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn-worker>=0.4.0",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
ignore = ["PLR0903"] # Ignore Pylint's "Too few public methods" (R0903)

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pylint.main]
# Ignore all auto-generated migration files
ignore-paths = ["^alembic/versions/.*$"]
