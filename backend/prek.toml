minimum_prek_version = "0.3.0"

default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

# Ignore all auto-generated Alembic migration scripts
exclude = { glob = "alembic/versions/**" }

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=1000"] },
  { id = "detect-private-key" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.3"

[[repos.hooks]]
id = "ruff-check"
args = ["--fix", "--exit-non-zero-on-fix"]
types_or = ["python", "pyi"]

[[repos.hooks]]
id = "ruff-format"
types_or = ["python", "pyi"]

[[repos]]
repo = "https://github.com/PyCQA/bandit"
rev = "1.9.4"

[[repos.hooks]]
id = "bandit"
args = ["-c", "pyproject.toml"]
additional_dependencies = ["bandit[toml]"]
exclude = "^tests/"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "mypy"
name = "mypy"
entry = "uv run mypy ."
language = "system"
types = ["python"]
pass_filenames = false
stages = ["pre-push", "manual"]

[[repos.hooks]]
id = "pytest"
name = "pytest"
entry = "uv run pytest"
language = "system"
pass_filenames = false
stages = ["pre-push", "manual"]
