services:
  # ==========================================
  # 1. APPLICATION DOMAIN
  # ==========================================
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    # Automatically run migrations before starting the API
    command: >
      sh -c "alembic upgrade head &&
      uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
      - ../alembic:/app/alembic
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - APP_NAME=Modular FastAPI Backend
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db-app:5432/app_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Tells FastAPI where to send Prefect flow runs
      - PREFECT_API_URL=http://prefect-server:4200/api
    depends_on:
      db-app:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  # ==========================================
  # 2. ORCHESTRATION LAYER (Prefect 3)
  # ==========================================
  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://postgres:postgres@db-prefect:5432/prefect_db
      - PREFECT_SERVER_API_HOST=0.0.0.0
    ports:
      - "4200:4200" # Prefect UI
    depends_on:
      db-prefect:
        condition: service_healthy

  prefect-worker:
    # Builds from the exact same Dockerfile as the API so it has Docling, ArXiv, etc.
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    command: >
      sh -c "prefect work-pool create arxiv-pool --type process || true
      && prefect worker start --pool arxiv-pool"
    volumes:
      - ../src:/app/src
      # CRITICAL: Persists gigabytes of downloaded PyTorch models between restarts
      - docling_model_cache:/root/.cache/docling/models
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db-app:5432/app_db
      - QDRANT_URL=http://qdrant:6333
      - PREFECT_API_URL=http://prefect-server:4200/api
    depends_on:
      app:
        condition: service_started

  # ==========================================
  # 3. STORAGE & INFRASTRUCTURE
  # ==========================================
  db-app:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    healthcheck:
      # Fixed: Now checks that the specific database is ready, not just the server
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-prefect:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prefect_db
    ports:
      - "5433:5432" # Mapped to 5433 locally to avoid collision with db-app
    volumes:
      - postgres_prefect_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prefect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest # Upgraded from v1.9.0
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

# ==========================================
# 4. PERSISTENT VOLUMES
# ==========================================
volumes:
  postgres_app_data:
  postgres_prefect_data:
  redis_data:
  qdrant_data:
  docling_model_cache:
  huggingface_cache:
